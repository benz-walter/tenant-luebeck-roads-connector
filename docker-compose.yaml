services:
  roads:
    image: roads
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      - path: .env.defaults
        required: true
      - path: .env
        required: false
    volumes:
      - ./src:/app
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  database:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_PASSWORD: this.key.is.unsecure.and.should.be.only.used.in.development.Ahsh1shuchue
    volumes:
      - database:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 2s
      retries: 3

  rabbitmq:
    image: rabbitmq:4.2.4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  database:
  rabbitmq:
