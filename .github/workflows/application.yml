name: application.yml
on: [push]

permissions:
  packages: write  # Required if publishing to GitHub Packages

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/roads-connector

jobs:
  build-development:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
    steps:
      - id: image-tag
        run: echo "image_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build development image
        uses: docker/build-push-action@v6
        with:
          target: development
          tags: ${{ steps.image-tag.outputs.image_tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-ruff-format:
    needs: build-development
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-development.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v6
      - run: "uv run --directory src -- ruff format --diff"

  test-ruff-check:
    needs: build-development
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-development.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - uses: actions/checkout@v6
      - run: "uv run --directory src -- ruff check --diff"

  release:
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}
    needs:
      - test-ruff-check
      - test-ruff-format
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
    steps:
      - id: image-tag
        run: echo "image_tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          target: production
          tags: ${{ steps.image-tag.outputs.image_tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
